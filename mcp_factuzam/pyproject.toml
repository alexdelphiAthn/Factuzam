[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "factuzam-mcp"
version = "0.1.0"
description = "Servidor MCP seguro para consultar stock, informar ventas y orquestar ventas mediante el dominio de Factuzam"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [
  { name = "Factuzam" },
]
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2,<3",
  "PyMySQL>=1.1,<3",
]

[project.scripts]
factuzam-mcp = "factuzam_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["factuzam_mcp*"]
