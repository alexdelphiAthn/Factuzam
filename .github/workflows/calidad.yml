name: Calidad

on:
  pull_request:
  merge_group:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trinquetes:
    name: Pruebas de infraestructura
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Comprobar trinquetes y compilación reproducible
        shell: pwsh
        run: |
          .\tests\arquitectura\PruebasArquitecturaS31.ps1
          .\tests\compilacion\PruebasCompilacionS32.ps1

  compilacion-delphi:
    name: fzam Release Win32 y Win64
    runs-on:
      - self-hosted
      - Windows
      - Delphi
    timeout-minutes: 90
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Compilar fzam
        shell: pwsh
        run: >-
          .\eng\compilar.ps1
          -Configuracion Release
          -Plataforma Ambas
