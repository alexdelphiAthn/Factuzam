name: Calidad

on:
  pull_request:
  merge_group:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trinquetes:
    name: Trinquetes y pruebas de scripts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Comprobar calidad
        shell: pwsh
        run: .\scripts\comprobar_calidad.ps1

  pruebas-delphi:
    name: fzam y DUnitX Win32 y Win64
    runs-on:
      - self-hosted
      - Windows
      - Delphi
    timeout-minutes: 90
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v6
      - name: Compilar fzam y ejecutar DUnitX
        shell: pwsh
        run: .\scripts\ejecutar_pruebas_delphi.ps1
